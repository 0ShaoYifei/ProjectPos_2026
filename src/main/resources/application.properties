spring.application.name=ProjectPos_2026
# Local credentials are ignored by Git and also work when starting directly from IDEA.
spring.config.import=optional:file:./.local/database.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pos_2026_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:${pos.local.database-password:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.thymeleaf.cache=false
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.error.include-message=never
server.servlet.session.timeout=30m
