<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>Products | Market POS</title><link rel="stylesheet" th:href="@{/style.css}"></head><body>
<header th:replace="~{fragments :: nav}"></header><main><div class="title"><div><p class="eyebrow">Inventory</p><h1>Products</h1><p>Manage prices, available stock and product availability.</p></div><a class="button" th:href="@{/products/new}">Add product</a></div>
<div th:replace="~{fragments :: messages}"></div><section><table><thead><tr><th>Barcode</th><th>Product</th><th class="money">Price (CNY)</th><th>In stock</th><th>Status</th><th>Action</th></tr></thead><tbody>
<tr th:each="p : ${products}"><td th:text="${p.barcode}"></td><td th:text="${p.name}"></td><td class="money" th:text="${p.price}"></td><td th:text="${p.stock}"></td><td><span class="badge" th:text="${p.active ? 'Active' : 'Inactive'}"></span></td><td><a th:href="@{/products/{id}/edit(id=${p.id})}">Edit</a></td></tr>
<tr th:if="${#lists.isEmpty(products)}"><td colspan="6" class="empty">No products yet. Add a product to start a sale.</td></tr></tbody></table></section><p class="muted">Deactivate a product to remove it from new sales while keeping its transaction history.</p></main></body></html>
