<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>New sale | Market POS</title><link rel="stylesheet" th:href="@{/style.css}"></head><body><header th:replace="~{fragments :: nav}"></header><main><p class="eyebrow">Checkout</p><h1>New sale</h1><p>Add products, review the total and collect cash payment.</p><div th:replace="~{fragments :: messages}"></div><div class="split"><div><section><h2>Add an item</h2><form class="inline" method="post" th:action="@{/sales/cart/add}"><input type="hidden" name="_csrf" th:value="${csrf}"><label>Product<select name="productId" required><option value="">Choose a product</option><option th:each="p : ${products}" th:value="${p.id}" th:text="${p.barcode + ' - ' + p.name + ' | CNY ' + p.price + ' | Stock: ' + p.stock}"></option></select></label><label class="compact">Quantity<input name="quantity" type="number" min="1" max="10000" value="1" required></label><button>Add item</button></form></section><section><h2>Sale items</h2><table><thead><tr><th>Product</th><th>Qty</th><th class="money">Unit price</th><th class="money">Subtotal</th><th></th></tr></thead><tbody><tr th:each="line : ${lines}"><td th:text="${line.name}"></td><td th:text="${line.quantity}"></td><td class="money" th:text="${line.unitPrice}"></td><td class="money" th:text="${line.subtotal}"></td><td><form method="post" th:action="@{/sales/cart/remove}"><input type="hidden" name="_csrf" th:value="${csrf}"><input type="hidden" name="productId" th:value="${line.productId}"><button class="secondary">Remove</button></form></td></tr><tr th:if="${#lists.isEmpty(lines)}"><td colspan="5" class="empty">Your cart is empty.</td></tr></tbody></table><form class="actions" method="post" th:action="@{/sales/cart/clear}" th:if="${!#lists.isEmpty(lines)}"><input type="hidden" name="_csrf" th:value="${csrf}"><button class="secondary">Clear cart</button></form></section></div><section><h2>Cash payment</h2><p class="muted">Total to collect (CNY)</p><div class="total" th:text="${total}"></div><form method="post" th:action="@{/sales/checkout}"><input type="hidden" name="_csrf" th:value="${csrf}"><input type="hidden" name="checkoutKey" th:value="${checkoutKey}"><label>Cash received (CNY)<input type="number" name="cash" min="0" max="999999999.99" step="0.01" required></label><div class="actions"><button th:disabled="${#lists.isEmpty(lines)}">Complete sale</button></div></form><p class="muted">Prices and stock are checked again when payment is recorded. Change appears on the receipt.</p></section></div></main></body></html>
