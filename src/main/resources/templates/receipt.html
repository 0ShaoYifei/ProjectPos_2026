<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>Sale receipt | Market POS</title><link rel="stylesheet" th:href="@{/style.css}"></head><body><header th:replace="~{fragments :: nav}"></header><main class="receipt"><div th:replace="~{fragments :: messages}"></div><section><div class="title"><div><p class="eyebrow">Market POS</p><h1 th:text="${'Receipt POS-' + sale.id}"></h1><p th:text="${#temporals.format(sale.createdAt, 'yyyy-MM-dd HH:mm:ss') + ' | Shanghai time'}"></p></div><span class="badge">PAID IN CASH</span></div><table><thead><tr><th>Product</th><th>Barcode</th><th>Qty</th><th class="money">Unit price</th><th class="money">Subtotal</th></tr></thead><tbody><tr th:each="i : ${sale.items}"><td th:text="${i.productName}"></td><td th:text="${i.barcode}"></td><td th:text="${i.quantity}"></td><td class="money" th:text="${i.unitPrice}"></td><td class="money" th:text="${i.subtotal}"></td></tr></tbody></table><div class="receipt-summary"><div>Total (CNY)<strong th:text="${sale.total}"></strong></div><div>Cash received<strong th:text="${sale.cashPaid}"></strong></div><div>Change due<strong th:text="${sale.changeDue}"></strong></div></div><p>Thank you for shopping with us. Please keep this receipt for returns.</p><p class="muted" th:text="${'Refunds recorded: CNY ' + sale.refundedTotal}"></p><div class="actions no-print"><button type="button" onclick="window.print()">Print receipt</button><a th:href="@{/sales/new}">Next sale</a><a th:href="@{/sales}">All transactions</a></div></section></main></body></html>
