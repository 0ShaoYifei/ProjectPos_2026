<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>Transactions | Market POS</title><link rel="stylesheet" th:href="@{/style.css}"></head><body><header th:replace="~{fragments :: nav}"></header><main><div class="title"><div><p class="eyebrow">Sales ledger</p><h1>Transactions and returns</h1><p>Open a receipt to review a sale or return purchased items.</p></div><a class="button" th:href="@{/sales/new}">New sale</a></div><section><form class="inline" action="/sales/lookup" method="get"><label>Find a receipt by sale number<input name="id" type="number" min="1" required></label><button>Find receipt</button></form></section><section><table><thead><tr><th>Receipt</th><th>Date and time (Shanghai)</th><th class="money">Total (CNY)</th><th class="money">Cash received</th><th class="money">Change</th><th>Action</th></tr></thead><tbody><tr th:each="s : ${sales}"><td th:text="${'POS-' + s.id}"></td><td th:text="${#temporals.format(s.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></td><td class="money" th:text="${s.total}"></td><td class="money" th:text="${s.cashPaid}"></td><td class="money" th:text="${s.changeDue}"></td><td><a th:href="@{/sales/{id}(id=${s.id})}">Receipt and returns</a></td></tr><tr th:if="${#lists.isEmpty(sales)}"><td colspan="6" class="empty">No completed sales yet.</td></tr></tbody></table></section></main></body></html>
