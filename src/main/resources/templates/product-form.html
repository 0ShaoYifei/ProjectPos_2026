<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>Product details | Market POS</title><link rel="stylesheet" th:href="@{/style.css}"></head><body><header th:replace="~{fragments :: nav}"></header><main class="narrow"><p class="eyebrow">Inventory</p><h1 th:text="${productId == null ? 'Add product' : 'Edit product'}"></h1><section><form th:action="@{/products/save}" th:object="${productForm}" method="post"><input type="hidden" name="_csrf" th:value="${csrf}"><input type="hidden" name="id" th:value="${productId}"><input type="hidden" th:field="*{version}">
<p class="error" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
<label>Barcode<input th:field="*{barcode}" maxlength="40" pattern="[A-Za-z0-9-]{1,40}" required></label><p class="error" th:errors="*{barcode}"></p>
<label>Product name<input th:field="*{name}" maxlength="100" required></label><p class="error" th:errors="*{name}"></p>
<label>Unit price (CNY)<input th:field="*{price}" type="number" min="0.01" max="999999.99" step="0.01" required></label><p class="error" th:errors="*{price}"></p>
<label>Stock quantity<input th:field="*{stock}" type="number" min="0" max="1000000" required></label><p class="error" th:errors="*{stock}"></p>
<label th:if="${productId != null}" class="check"><input type="checkbox" th:field="*{active}"> Available for new sales</label><p class="muted">When editing stock, enter the actual quantity on hand.</p><div class="actions"><button type="submit">Save product</button><a th:href="@{/products}">Cancel</a></div></form></section></main></body></html>
